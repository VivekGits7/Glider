<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Glider app icon: two wing blades on a dark glass tile (macOS 824px grid). -->
  <defs>
    <path id="top" d="M160 493 C168 410 215 320 290 262 C355 212 440 186 515 175 C506 222 480 262 440 290 C400 316 340 322 300 334 C255 348 220 380 198 425 C185 450 172 472 160 493 Z"/>
    <path id="low" d="M195 476 C205 440 225 405 258 382 C300 354 360 342 465 328 C462 375 440 418 395 440 C330 470 260 472 195 476 Z"/>
    <clipPath id="tile-clip"><rect x="100" y="100" width="824" height="824" rx="190"/></clipPath>
    <clipPath id="top-clip"><use href="#top"/></clipPath>
    <clipPath id="low-clip"><use href="#low"/></clipPath>

    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1220"/><stop offset="0.55" stop-color="#110c15"/><stop offset="1" stop-color="#140c1c"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.07"/><stop offset="0.3" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bottom-glow" cx="0.62" cy="1.02" r="0.62">
      <stop offset="0" stop-color="#8f4fe0" stop-opacity="0.38"/><stop offset="0.6" stop-color="#6a33b0" stop-opacity="0.1"/><stop offset="1" stop-color="#6a33b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="side-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a52d6" stop-opacity="0.22"/><stop offset="0.08" stop-color="#9a52d6" stop-opacity="0.09"/><stop offset="0.3" stop-color="#9a52d6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9dcf5" stop-opacity="0.32"/><stop offset="0.25" stop-color="#e9dcf5" stop-opacity="0.07"/>
      <stop offset="0.7" stop-color="#9b5cf0" stop-opacity="0.18"/><stop offset="1" stop-color="#a866f5" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="top-face" gradientUnits="userSpaceOnUse" x1="500" y1="180" x2="170" y2="480">
      <stop offset="0" stop-color="#f1c3f0"/><stop offset="0.4" stop-color="#e4a6e9"/><stop offset="0.8" stop-color="#cd78de"/><stop offset="1" stop-color="#bd5fd6"/>
    </linearGradient>
    <radialGradient id="top-gloss" gradientUnits="userSpaceOnUse" cx="400" cy="235" r="170">
      <stop offset="0" stop-color="#fff" stop-opacity="0.38"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="low-face" gradientUnits="userSpaceOnUse" x1="460" y1="340" x2="200" y2="470">
      <stop offset="0" stop-color="#b384f6"/><stop offset="0.45" stop-color="#b56ff0"/><stop offset="1" stop-color="#cf72e2"/>
    </linearGradient>
    <linearGradient id="low-shade" gradientUnits="userSpaceOnUse" x1="0" y1="335" x2="0" y2="400">
      <stop offset="0" stop-color="#3c1260" stop-opacity="0.55"/><stop offset="1" stop-color="#3c1260" stop-opacity="0"/>
    </linearGradient>

    <filter id="tile-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="blade-shadow" x="-40%" y="-40%" width="190%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="13" result="cb"/><feOffset in="cb" dx="9" dy="16" result="co"/>
      <feFlood flood-color="#05010a" flood-opacity="0.8"/><feComposite in2="co" operator="in" result="cast"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="tb"/><feOffset in="tb" dx="2" dy="4" result="to"/>
      <feFlood flood-color="#05010a" flood-opacity="0.9"/><feComposite in2="to" operator="in" result="contact"/>
      <feMerge><feMergeNode in="cast"/><feMergeNode in="contact"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="1.2"/></filter>
  </defs>


  <!-- glass tile -->
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#tile)" filter="url(#tile-shadow)"/>
  <g clip-path="url(#tile-clip)">
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#bottom-glow)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#side-glow)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="188.5" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- wings, traced in the reference's 532px frame -->
  <g transform="translate(100 100) scale(1.5489) translate(-66 -72)">
    <g filter="url(#blade-shadow)">
      <use href="#low" transform="translate(1.5 4)" fill="#4a1a78"/>
      <use href="#low" fill="url(#low-face)"/>
    </g>
    <g clip-path="url(#low-clip)"><rect x="180" y="320" width="300" height="160" fill="url(#low-shade)"/></g>
    <g filter="url(#blade-shadow)">
      <use href="#top" transform="translate(2 5)" fill="#6a2690"/>
      <use href="#top" fill="url(#top-face)"/>
    </g>
    <g clip-path="url(#top-clip)">
      <rect x="150" y="160" width="380" height="340" fill="url(#top-gloss)"/>
      <use href="#top" transform="translate(-2 -2)" fill="none" stroke="#fff" stroke-opacity="0.12" stroke-width="2" filter="url(#soft)"/>
    </g>
  </g>
</svg>
